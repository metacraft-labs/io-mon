# Build policy for the Windows injected shim (librepro_monitor_shim.dll and its
# 32-bit twin). Nim applies this file to every build whose project file is
# windows_interpose.nim, so scripts/build_shim.sh and reprobuild's shim edges
# pick it up with no flag of their own. See docs/contributors/shim-build-policy.md.

-d:noSignalHandler    # a shim must NOT install signal handlers
# The shim is injected into arbitrary children (gcc, cc1, rustc, ...). Nim's
# default runtime installs SIGSEGV/SIGILL/... handlers through the CRT's
# `signal()` in whatever process loads it, which takes over the HOST's access
# violations: an injected child that faults for any reason then prints
# "SIGSEGV: Illegal storage access" and quit(1)s, so a crash in the host
# (or one caused by the injection itself) is misreported as a Nim error in a
# program that contains no Nim, and gcc then fails silently with exit 1.
# Observed exactly so on a Windows CI host (2026-09): the faults were an
# injection defect, and the Nim handler hid the real exception code. A
# monitor observes; it does not handle the host's faults. macOS carries the
# same define in macos_interpose.nim.cfg.
