# Injected Linux libraries follow the POSIX shim policy. Successful exec from
# vfork never unwinds the child's Nim frames and shares TLS with its parent;
# compiler-generated trace frames must not survive in the suspended host.
# The shim also must not take ownership of the host's synchronous faults.
# See docs/contributors/shim-build-policy.md. These settings do not replace
# allocation-free C dispatch for hooks entered from hostile runtime contexts.
--stackTrace:off
--lineTrace:off
-d:noSignalHandler
--mm:arc
# Keep exceptions:goto: writer/codec exception handling remains required.
