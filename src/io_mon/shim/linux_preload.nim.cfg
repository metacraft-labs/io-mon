# Injected Linux libraries follow the POSIX shim policy. Successful exec from
# vfork never unwinds the child's Nim frames and shares TLS with its parent;
# compiler-generated trace frames must not survive in the suspended host.
# The shim also must not take ownership of the host's synchronous faults.
# See docs/contributors/shim-build-policy.md. These settings do not replace
# allocation-free C dispatch for hooks entered from hostile runtime contexts.
--stackTrace:off
--lineTrace:off
-d:noSignalHandler
--mm:arc
# A second preload must not redirect this image's initialization/forwarding
# helpers into the first image's state. Keep exports visible to consumers,
# but bind this library's own definitions locally. The shim has no public
# data definitions. Zig's glibc-baseline release linker supports -Bsymbolic,
# while it rejects -Bsymbolic-functions before linking.
--passL:"-Wl,-Bsymbolic"
# Keep exceptions:goto: writer/codec exception handling remains required.
# The shim interposes the plain AND the large-file / 64-bit-time entry points
# of a 32-bit glibc as separate functions (`stat` and `__stat64_time64`,
# `open` and `open64`, ...), so its own C must see the plain ABI. Debian's
# gcc for armhf predefines _TIME_BITS=64 and _FILE_OFFSET_BITS=64, under which
# glibc's headers rename `stat` to `__stat64_time64` and `open` to `open64`,
# and the shim then defines each of those symbols twice. Both are no-ops
# wherever they are not predefined (every LP64 target).
--passC:"-U_TIME_BITS -U_FILE_OFFSET_BITS"
# Link only the C-runtime libraries the shim uses. Nim adds `-lm -lrt -ldl`
# and `-pthread` to every Linux link, and the shim needs only `libc.so.6` and
# the loader; any other NEEDED entry is loaded into every monitored program.
# A program that finds its C runtime through its DT_RUNPATH cannot resolve
# them at all (a program's DT_RUNPATH serves only its own direct dependencies,
# never a preloaded object's; ld.so(8),
# https://man7.org/linux/man-pages/man8/ld.so.8.html), so it dies before main
# with "libm.so.6: cannot open shared object file". Elsewhere they can come
# from a different glibc build than the program's libc and fail its ABI checks.
#
# `--as-needed` must come BEFORE the `-l` flags Nim adds, which a `--passL`
# cannot do (it lands after them, where it still drops `-ldl` and `-lpthread`
# but not `-lm -lrt`), so it is the head of the link template. This file is
# read by every compile of `linux_preload.nim` -- io-mon's
# `scripts/build_shim.sh` and every consumer that compiles the shim from
# io-mon's tree -- so each of them links the same way.
# `tests/linux/test_io_mon_shim_needs_only_the_c_runtime.nim` holds both.
#
# `-static-libgcc` keeps `--as-needed` in force for the `-lpthread` the driver
# adds for `-pthread`. Clang links the shared libgcc as
# `--as-needed -lgcc_s --no-as-needed`, and that trailing `--no-as-needed`
# applies to the `-lpthread -lc` after it, so a Clang-built shim recorded
# `libpthread.so.0` as NEEDED although glibc >= 2.34 puts nothing in it. The
# static libgcc adds code only for libgcc symbols the shim references; it
# imports no unwinder today. `zig cc` links compiler-rt instead of libgcc and
# reports the flag as unused, which is harmless.
gcc.linkTmpl = "-Wl,--as-needed $buildgui $builddll -o $exefile $objfiles $options"
clang.linkTmpl = "-Wl,--as-needed $buildgui $builddll -o $exefile $objfiles $options"
--passL:"-static-libgcc"
