# Injected Linux libraries follow the POSIX shim policy. Successful exec from
# vfork never unwinds the child's Nim frames and shares TLS with its parent;
# compiler-generated trace frames must not survive in the suspended host.
# The shim also must not take ownership of the host's synchronous faults.
# See docs/contributors/shim-build-policy.md. These settings do not replace
# allocation-free C dispatch for hooks entered from hostile runtime contexts.
--stackTrace:off
--lineTrace:off
-d:noSignalHandler
--mm:arc
# A second preload must not redirect this image's initialization/forwarding
# helpers into the first image's state. Keep exports visible to consumers,
# but bind this library's own definitions locally. The shim has no public
# data definitions. Zig's glibc-baseline release linker supports -Bsymbolic,
# while it rejects -Bsymbolic-functions before linking.
--passL:"-Wl,-Bsymbolic"
# Keep exceptions:goto: writer/codec exception handling remains required.
# The shim interposes the plain AND the large-file / 64-bit-time entry points
# of a 32-bit glibc as separate functions (`stat` and `__stat64_time64`,
# `open` and `open64`, ...), so its own C must see the plain ABI. Debian's
# gcc for armhf predefines _TIME_BITS=64 and _FILE_OFFSET_BITS=64, under which
# glibc's headers rename `stat` to `__stat64_time64` and `open` to `open64`,
# and the shim then defines each of those symbols twice. Both are no-ops
# wherever they are not predefined (every LP64 target).
--passC:"-U_TIME_BITS -U_FILE_OFFSET_BITS"
