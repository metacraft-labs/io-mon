name: Linux IPC isolation diagnostic

on:
  push:
    branches: [diagnose-linux-ipc-isolation-2026-10-01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Mint installation token for source bootstrap
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Setup the promotion's source bootstrap
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@ad0535e1305cf59fa2f52dddb1b0cdc6787a0e21
        with:
          env-flavor: reprobuild
          repro-from-source: true
          repro-build-pin: c14b1e618d7c4b64476d89792e80b8e8f10b8a52
          repro-posix-io-mon-pin: 3df08c24ee91900b950ed20a3827923d213f2a9c
          repro-runquota-pin: 292e578d57eb85d6037f9e2d3a03f0bcb0489dbb
          gh-token: ${{ steps.ci_token.outputs.token }}
      - name: Refresh build authentication
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@bcd29c631ff01fbd0e577c5f96e5f9d5211fed26
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Compare the identical fixture with both execution policies
        shell: bash
        run: /usr/bin/python3 .github/scripts/diagnose_linux_ipc_isolation.py
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ipc-isolation-controls
          path: |
            build/diagnostics/linux-ipc-isolation/*.log
            build/diagnostics/linux-ipc-isolation/*.summary.json
          if-no-files-found: warn
          retention-days: 7

  windows-exit-control:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check native failure propagation through the exact pinned tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'io-mon-native-exit-control'
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest 'https://nim-lang.org/download/nim-2.2.10_x64.zip' -OutFile "$root/nim.zip"
          if ((Get-FileHash "$root/nim.zip").Hash.ToLower() -ne 'fe0686a9b298e5b13d0a983df37e002a8c6320f8b16cc45a51d15cf4046a109f') { throw 'Nim archive checksum mismatch' }
          Expand-Archive "$root/nim.zip" "$root/nim"
          Invoke-WebRequest 'https://github.com/casey/just/releases/download/1.51.0/just-1.51.0-x86_64-pc-windows-msvc.zip' -OutFile "$root/just.zip"
          if ((Get-FileHash "$root/just.zip").Hash.ToLower() -ne '09d1138b6845e73f04bff5e26be3f57663bddca25e36fe6241d28a5aa310b64e') { throw 'Just archive checksum mismatch' }
          Expand-Archive "$root/just.zip" "$root/just"
          $nimBin = (Get-ChildItem "$root/nim" -Filter nimble.exe -Recurse | Select-Object -First 1).DirectoryName
          $env:PATH = "$nimBin;$root/just;$env:PATH"
          Set-Location $root
          @'
          version = "0.1.0"
          author = "Metacraft Labs"
          description = "Real child exit status diagnostic"
          license = "MIT"
          task test, "Fail through a real child process":
            exec "cmd /c exit 17"
          '@ | Set-Content -Encoding ascii exit_control.nimble
          "test:`n    nimble test" | Set-Content -Encoding ascii Justfile
          & nimble test
          $nimbleExit = $LASTEXITCODE
          & just test
          $justExit = $LASTEXITCODE
          Write-Host "Nimble exit=$nimbleExit; Just exit=$justExit; expected both nonzero"
          if ($nimbleExit -eq 0 -or $justExit -eq 0) { throw 'A real child failure was reported as success' }
