name: Native test runner diagnostic

on:
  push:
    branches: [diagnose-native-test-runner-2026-10-01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-runner:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check native failure propagation through the exact pinned tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'io-mon-native-exit-control'
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest 'https://nim-lang.org/download/nim-2.2.10_x64.zip' -OutFile "$root/nim.zip"
          if ((Get-FileHash "$root/nim.zip").Hash.ToLower() -ne 'fe0686a9b298e5b13d0a983df37e002a8c6320f8b16cc45a51d15cf4046a109f') { throw 'Nim archive checksum mismatch' }
          Expand-Archive "$root/nim.zip" "$root/nim"
          Invoke-WebRequest 'https://github.com/casey/just/releases/download/1.51.0/just-1.51.0-x86_64-pc-windows-msvc.zip' -OutFile "$root/just.zip"
          if ((Get-FileHash "$root/just.zip").Hash.ToLower() -ne '09d1138b6845e73f04bff5e26be3f57663bddca25e36fe6241d28a5aa310b64e') { throw 'Just archive checksum mismatch' }
          Expand-Archive "$root/just.zip" "$root/just"
          $nimBin = (Get-ChildItem "$root/nim" -Filter nimble.exe -Recurse | Select-Object -First 1).DirectoryName
          $env:PATH = "$nimBin;$root/just;$env:PATH"
          Invoke-WebRequest 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r2.7z' -OutFile "$root/gcc.7z"
          if ((Get-FileHash "$root/gcc.7z").Hash.ToLower() -ne '62fb8588d2deee7d662dbcbd386702adbf19643764c971c38aa4839472eee232') { throw 'GCC archive checksum mismatch' }
          & 7z x "$root/gcc.7z" "-o$root/gcc" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GCC extraction failed' }
          $env:PATH = "$root/gcc/mingw64/bin;$env:PATH"
          New-Item -ItemType Directory -Force "$root/scripts", "$root/tests/portable", "$root/tests/helpers" | Out-Null
          Copy-Item Justfile "$root/Justfile"
          Copy-Item scripts/run_tests.nims, scripts/test_catalog.nims "$root/scripts/"
          Set-Location $root
          'writeFile("success.marker", "executed")' | Set-Content -Encoding ascii tests/portable/test_01_success.nim
          & just test
          $passExit = $LASTEXITCODE
          if ($passExit -ne 0 -or -not (Test-Path success.marker)) { throw 'Passing compiled fixture did not execute successfully' }
          'quit(17)' | Set-Content -Encoding ascii tests/portable/test_02_failure.nim
          'writeFile("unexpected.marker", "executed")' | Set-Content -Encoding ascii tests/portable/test_03_after_failure.nim
          & just test
          $failExit = $LASTEXITCODE
          Write-Host "Real passing program exit=$passExit; real failing program gate exit=$failExit"
          if ($failExit -eq 0 -or (Test-Path unexpected.marker)) { throw 'The native runner swallowed a real test failure' }
          exit 0
