name: CI (reprobuild)

# Additive side-by-side CI run that re-plays io-mon's deterministic dev
# env through reprobuild instead of `nix develop`. Runs alongside the
# existing `ci.yml` (`nix`) so regressions in either path still gate
# merges — see
# `metacraft-dev-guidelines/policies/ci-workflow-standards.md`
# (`repro build` / `repro test` run on all five platforms) and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). It clones the workspace siblings listed
# in `.github/sibling-repos` at the workspace-lock-pinned revisions, then
# materialises the env so `repro build` / `repro test` can drive the
# recipe in `repro.nim` end-to-end on every supported host.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: eph-linux-x64
          - os: linux
            arch: arm64
            runner: eph-linux-arm64
          - os: macos
            arch: arm64
            runner: eph-macos-arm64
          - os: windows
            arch: x64
            runner: eph-win-x64
          - os: windows
            arch: arm64
            runner: eph-win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone the private
      # metacraft-labs siblings and the workspace-lock manifest repo.
      # GitHub free plan restricts org-level secrets with visibility ALL
      # from being readable in private repos, so we mint per-run tokens
      # from the app secrets stored at repo level
      # (CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY).
      # Minted before the sibling clones so the workspace-lock manifest
      # checkout (private metacraft-manifests) can authenticate.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (nim-stackable-hooks, nim-shm-queue) at the workspace-lock-pinned
        # revisions before materialising the env. Those two are io-mon's
        # `uses:` library producers in repro.nim; reprobuild builds each
        # from source and threads their `src/` roots onto io-mon's compile.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: reprobuild
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Rebuild the engine's io-mon shim from the checkout under test
        # WHY THIS STEP EXISTS -- measured, not assumed.
        #
        # `repro build` monitors its own build actions by loading
        # `.reprobuild-src/build/lib/librepro_monitor_shim.<ext>`. That library
        # is produced during `Setup dev env`, by reprobuild's `just build`
        # running inside reprobuild's `nix develop`. reprobuild's flake.nix
        # exports `IO_MON_SRC=${io-mon-src}/src` -- a PINNED store path -- and
        # both `scripts/build_apps.sh` (`io_mon_src="${IO_MON_SRC:-../io-mon}"`)
        # and reprobuild's `config.nims` prefer `$IO_MON_SRC` over the
        # `../io-mon` sibling. So the shim the engine loads is compiled from
        # reprobuild's PIN, not from this checkout.
        #
        # Evidence, job 102069636810 (run 34228866337, linux-arm64), the Nim
        # compile line inside `Setup dev env`:
        #
        #   proj: /nix/store/18gfj81y4q901pw88bl2969r0h1dmc4c-source/src/io_mon/shim/linux_preload.nim
        #   out:  .../io-mon/.reprobuild-src/build/lib/tmp/librepro_monitor_shim.so
        #
        # -- a /nix/store source path while the checkout sat at
        # `.../_work/io-mon/io-mon/src`. Consequence: a change this PR makes to
        # the shim is not what the reprobuild lanes compile, so those lanes
        # grade the pin rather than the diff.
        #
        # Windows is excluded because it is NOT affected: the windows-diy
        # flavor's `env.ps1` resolves `IO_MON_SRC` with
        # `Test-SiblingRepo -Name io-mon`, i.e. from the checkout, already.
        # Only the nix-provisioned POSIX hosts read the pinned store path.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          engine_src="${GITHUB_WORKSPACE}/.reprobuild-src"
          engine_lib="${engine_src}/build/lib"
          case "$(uname -s)" in
            Darwin) shim_name="librepro_monitor_shim.dylib" ;;
            *)      shim_name="librepro_monitor_shim.so" ;;
          esac
          shim="${engine_lib}/${shim_name}"

          # Fail loudly if the layout this step depends on is not there. A
          # silent no-op would restore exactly the blindness being fixed.
          if [ ! -f "${shim}" ]; then
            echo "::error::expected the engine's shim at ${shim} after 'Setup dev env'; it is absent."
            echo "::error::Refusing to continue: without replacing it, this lane grades reprobuild's io-mon pin, not this checkout."
            exit 1
          fi
          before="$(cksum < "${shim}")"
          echo "engine shim before: ${shim_name} cksum=${before}"

          # Rebuild INSIDE reprobuild's dev shell so STACKABLE_HOOKS_SRC /
          # SHM_QUEUE_SRC / SHM_GSET_SRC and the Nim toolchain are the exact
          # ones the pinned build used -- the ONLY thing that changes is that
          # the shim sources now come from this checkout (build_shim.sh cd's to
          # its own repo root and compiles with `--path:src`).
          overrides=()
          for pair in \
            "codetracer-native-recorder:${GITHUB_WORKSPACE}/codetracer-native-recorder" \
            "runquota-src:${GITHUB_WORKSPACE}/runquota"; do
            input="${pair%%:*}"
            path="${pair#*:}"
            # Only override inputs whose local clone the setup action actually
            # produced; otherwise let the flake resolve them itself.
            if [ -d "${path}" ]; then
              overrides+=(--override-input "${input}" "path:${path}")
            fi
          done

          cd "${engine_src}"
          nix develop "${overrides[@]}" --command bash -c '
            set -euo pipefail
            export IO_MON_SRC="'"${GITHUB_WORKSPACE}"'/src"
            export IO_MON_SHIM_OUT_DIR="'"${engine_lib}"'"
            export IO_MON_SHIM_NIMCACHE_DIR="'"${RUNNER_TEMP}"'/engine-shim-nimcache"
            bash "'"${GITHUB_WORKSPACE}"'/scripts/build_shim.sh"
          '

          after="$(cksum < "${shim}")"
          echo "engine shim after:  ${shim_name} cksum=${after}"
          if [ ! -f "${shim}" ]; then
            echo "::error::the rebuild did not produce ${shim}"
            exit 1
          fi
          echo "the reprobuild engine will now monitor with the shim built from THIS checkout"

      - name: Engine shim resolves every symbol it references (Linux)
        # Same probe, and same self-validating negative control, as `ci.yml`'s
        # Build job -- applied to the shim the ENGINE will load. Without it a
        # broken shim surfaces four steps later as an opaque
        # `repro build: error: interface extraction edge asFailed`, with the
        # real cause (`symbol lookup error: ... undefined symbol: ...`) buried
        # in the middle of a 7000-line log. That is what happened in job
        # 102069636810.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shim="${GITHUB_WORKSPACE}/.reprobuild-src/build/lib/librepro_monitor_shim.so"
          test -f "${shim}"
          probe_dir="$(mktemp -d)"
          cat > "${probe_dir}/dlopen_probe.c" <<'PROBE'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            if (argc < 2) { fprintf(stderr, "usage: dlopen_probe <library>\n"); return 2; }
            void *handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
            if (handle == NULL) { fprintf(stderr, "dlopen: %s\n", dlerror()); return 1; }
            return 0;
          }
          PROBE
          cat > "${probe_dir}/unresolvable.c" <<'BROKEN'
          extern int io_mon_ci_probe_absent_symbol(void);
          int io_mon_ci_probe_entry(void) { return io_mon_ci_probe_absent_symbol(); }
          BROKEN
          cd "${GITHUB_WORKSPACE}/.reprobuild-src"
          nix develop --command bash -c '
            set -euo pipefail
            cd "'"${probe_dir}"'"
            cc dlopen_probe.c -o dlopen_probe 2>/dev/null || cc dlopen_probe.c -o dlopen_probe -ldl
            cc -shared -fPIC unresolvable.c -o libunresolvable.so
          '
          if "${probe_dir}/dlopen_probe" "${probe_dir}/libunresolvable.so"; then
            echo "::error::the dlopen probe ACCEPTED an undefined symbol; a pass below would prove nothing."
            exit 1
          fi
          echo "negative control OK: probe rejected libunresolvable.so"
          if ! "${probe_dir}/dlopen_probe" "${shim}"; then
            echo "::error::the engine shim built from this checkout cannot be loaded on $(uname -m)."
            exit 1
          fi
          echo "engine shim loads on $(uname -m)"

      - name: repro build
        # Builds the conventional `default` collection declared in
        # `repro.nim` — the standalone `io-mon` CLI. Verifies the primary
        # shipping artefact materialises through the reprobuild engine
        # identically to `just build`.
        run: dev-exec repro build

      - name: repro test
        # Materialises the `test` collection (the portable + host-OS
        # io-mon suites).
        run: dev-exec repro test

      - name: just build (cross-check)
        # Re-runs the legacy `just build` path inside the same env so we
        # catch silent divergences between `repro build` outputs and what
        # the dev shell + Justfile produce today.
        run: dev-exec just build

      - name: just test (cross-check)
        run: dev-exec just test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/
            .repro/
          retention-days: 7
          if-no-files-found: ignore
