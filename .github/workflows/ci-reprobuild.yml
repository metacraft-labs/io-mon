name: CI (reprobuild)

# Additive side-by-side CI run that re-plays io-mon's deterministic dev
# env through reprobuild instead of `nix develop`. Runs alongside the
# existing `ci.yml` (`nix`) so regressions in either path still gate
# merges — see
# `metacraft-dev-guidelines/policies/ci-workflow-standards.md`
# (`repro build` / `repro test` run on all five platforms) and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). It clones the workspace siblings listed
# in `.github/sibling-repos` at the workspace-lock-pinned revisions, then
# materialises the env so `repro build` / `repro test` can drive the
# recipe in `repro.nim` end-to-end on every supported host.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone the private
      # metacraft-labs siblings and the workspace-lock manifest repo.
      # GitHub free plan restricts org-level secrets with visibility ALL
      # from being readable in private repos, so we mint per-run tokens
      # from the app secrets stored at repo level
      # (CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY).
      # Minted before the sibling clones so the workspace-lock manifest
      # checkout (private metacraft-manifests) can authenticate.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (nim-stackable-hooks, nim-shm-queue) at the workspace-lock-pinned
        # revisions before materialising the env. Those two are io-mon's
        # `uses:` library producers in repro.nim; reprobuild builds each
        # from source and threads their `src/` roots onto io-mon's compile.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: reprobuild
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: repro build
        # Builds the conventional `default` collection declared in
        # `repro.nim` — the standalone `io-mon` CLI. Verifies the primary
        # shipping artefact materialises through the reprobuild engine
        # identically to `just build`.
        run: dev-exec repro build

      - name: repro test
        # Materialises the `test` collection (the portable + host-OS
        # io-mon suites).
        run: dev-exec repro test

      - name: just build (cross-check)
        # Re-runs the legacy `just build` path inside the same env so we
        # catch silent divergences between `repro build` outputs and what
        # the dev shell + Justfile produce today.
        run: dev-exec just build

      - name: just test (cross-check)
        run: dev-exec just test

      # Diagnostics on failure. Three things below are load-bearing:
      #
      # 1. `include-hidden-files: true`. actions/upload-artifact@v4 defaults this
      #    input to false, and @actions/glob then skips any entry it traverses whose
      #    own basename starts with "." (internal-globber.ts:
      #    `if (options.excludeHiddenFiles && path.basename(item.path).match(/^\./))
      #    continue`). The old `path: .repro/` made `.repro` itself the search root,
      #    so it was skipped outright and this step logged
      #      "No files were found with the provided path: build/ .repro/"
      #    which `if-no-files-found: ignore` then swallowed. Net effect: the build
      #    engine's per-action stdio captures -- `<outDir>/build-engine-cache/
      #    actions/<actionId>.stderr.log`, see repro_build_engine.nim -- have never
      #    been uploaded from any leg of this workflow, on any platform.
      # 2. Narrow paths. A whole `.repro/` tree measures ~1.1 GiB (dominated by
      #    build-engine-cache/monitor-depfiles and dependency-evidence); the failure
      #    report plus the per-action logs are ~600 KiB. `build/` was narrowed to
      #    `build/**/*.log`: the whole tree is 111 MiB over 816 files, of which 105
      #    are logs. It always matched, so it would permanently mask the warning below.
      # 3. `if-no-files-found: warn` (the action's own default). This step only runs
      #    on failure, so a warning costs nothing -- and it is exactly what would have
      #    surfaced (1) years ago instead of hiding it behind a green step.
      #
      # Context, 2026-09: no leg of this workflow is green on ANY platform. Census of
      # the job records: linux-x64 77 failure / 19 cancelled / 0 success, linux-arm64
      # 77/19/0, macos-arm64 75/25/0, windows-x64 61/35/0. The only two successes on
      # record are from 2026-07-06, under the pre-rename job names. The arm64 leg
      # fails earlier than x64, and x64 fails for an unrelated project-level reason
      # (`cannot open file: results`, codetracer_ct_print.nim(24, 8)). These
      # artifacts are the only way to find out why any of it actually fails.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/**/*.log
            .repro/build/*/build-failure-report.json
            .repro/build/*/build-engine-cache/actions/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
